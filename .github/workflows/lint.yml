name: lint

on:
  workflow_call:
    inputs:
      error-on:
        required: false
        default: true
        type: boolean
        description: >-
          Failure threshold for linting, supplied as a boolean.
          Set to true to treat linting warnings as errors, false otherwise.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ github.token }}
      R_COMPILE_AND_INSTALL_PACKAGES: never
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: ${{ inputs.error-on }}

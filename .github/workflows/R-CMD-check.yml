name: R-CMD-check

on:
  workflow_call:
    inputs:
      error-on:
        required: false
        default: '"note"'
        type: string
        description: >-
          Failure threshold for R CMD check, supplied as an R string literal.
          Callers must retain the inner double quotes, for example:
          error-on: '"warning"'. Allowed literals are '"note"', '"warning"', and '"error"'.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-check
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-24.04, r: 'release'}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ github.token }}
      R_COMPILE_AND_INSTALL_PACKAGES: never
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: ${{ inputs.error-on }}
          args: c("--no-manual")

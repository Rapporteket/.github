name: Publish Docker image to Harbor
on:
  release:
    types: [published]
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

jobs:
  build:
    uses: rapporteket/.github/.github/workflows/harbor.yml@main
    secrets:
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}

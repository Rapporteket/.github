on:
  push:
    branches: [ $default-branch ]
  pull_request:
    branches: [ $default-branch ]

name: lint

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: rapporteket/.github/.github/workflows/lint.yml@main
